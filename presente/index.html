<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎁 Um presente pra você</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --laranja:#F54F03; --laranja-vivo:#FF5A12; --navy:#0D1D60; --navy-deep:#070F3E; --celeste:#61B1DF; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    font-family:"Hanken Grotesk", Arial, sans-serif;
    background: radial-gradient(900px 600px at 70% 20%, rgba(97,177,223,.16), transparent 60%),
                radial-gradient(700px 500px at 15% 85%, rgba(245,79,3,.10), transparent 60%),
                var(--navy-deep);
    color:#fff; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }

  /* bolhas ambiente */
  .bolha-bg {
    position:fixed; border-radius:50%;
    background: radial-gradient(circle at 32% 30%, rgba(255,255,255,.9), rgba(189,224,245,.35) 55%, rgba(97,177,223,.15));
    border:1px solid rgba(255,255,255,.5);
    animation: sobe linear infinite;
    pointer-events:none; opacity:0;
  }
  @keyframes sobe {
    0% { transform: translateY(0); opacity:0; }
    10% { opacity:.7; }
    100% { transform: translateY(-110vh); opacity:0; }
  }

  .palco { text-align:center; position:relative; padding:20px; }

  /* ===== presente ===== */
  .presente { position:relative; width:min(64vw,300px); margin:0 auto; cursor:pointer; transition:transform .3s cubic-bezier(.34,1.56,.64,1); }
  .presente:hover { transform:scale(1.05); }
  .presente svg { width:100%; height:auto; display:block; overflow:visible; }
  .caixa-wrap { animation: balanca 3s ease-in-out infinite; transform-origin:50% 90%; }
  @keyframes balanca {
    0%,100% { transform:rotate(0); }
    6% { transform:rotate(-3deg); } 12% { transform:rotate(3deg); }
    18% { transform:rotate(-2deg); } 24% { transform:rotate(0); }
  }
  .tampa { transform-origin:50% 100%; transition:transform 1s cubic-bezier(.3,.7,.35,1), opacity .9s ease .15s; }
  .aberto .tampa { transform: translateY(-240px) rotate(-24deg); opacity:0; }
  .corpo { transition:transform .8s cubic-bezier(.34,1.56,.64,1) .1s, opacity .7s ease .35s; transform-origin:50% 100%; }
  .aberto .corpo { transform:scale(.55) translateY(90px); opacity:0; }
  .aberto .caixa-wrap { animation:none; }
  .dica {
    margin-top:26px; font-family:Fredoka, sans-serif; font-weight:500;
    color:#B9C4EA; letter-spacing:.12em; text-transform:uppercase; font-size:.82rem;
    animation: pulsa 2s ease-in-out infinite;
  }
  @keyframes pulsa { 0%,100%{opacity:.65} 50%{opacity:1} }
  .aberto .dica { opacity:0; transition:opacity .3s; animation:none; }

  /* ===== confete de gotas ===== */
  .peta {
    position:fixed; pointer-events:none; z-index:5;
    border-radius:50% 50% 50% 0;
    animation: voa var(--dur,1.8s) cubic-bezier(.15,.6,.4,1) forwards;
  }
  @keyframes voa {
    0% { transform: translate(0,0) rotate(0) scale(.4); opacity:0; }
    8% { opacity:1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1); opacity:0; }
  }

  /* ===== revelação ===== */
  .revela {
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-46%) scale(.85);
    width:min(92vw,540px);
    opacity:0; pointer-events:none;
    transition:opacity .7s ease .55s, transform .8s cubic-bezier(.34,1.56,.64,1) .55s;
  }
  .aberto-fim .revela { opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }
  .revela .catavento { width:min(30vw,132px); margin:0 auto 18px; animation:gira 5s linear infinite; }
  @keyframes gira { to { transform:rotate(360deg); } }
  .revela h1 { font-family:Fredoka, sans-serif; font-weight:600; font-size:clamp(1.9rem,6.5vw,3rem); line-height:1.15; }
  .revela h1 em { font-style:normal; color:var(--laranja-vivo); }
  .revela p { color:#B9C4EA; font-size:clamp(1rem,3.2vw,1.15rem); margin:16px auto 0; max-width:430px; }
  .revela p b { color:#fff; }
  .btn-presente {
    display:inline-flex; align-items:center; gap:10px;
    margin-top:30px;
    font-family:Fredoka, sans-serif; font-weight:600; font-size:1.1rem;
    background:var(--laranja); color:#fff; text-decoration:none;
    padding:18px 40px; border-radius:999px;
    box-shadow:0 14px 44px rgba(245,79,3,.4);
    transition:transform .25s cubic-bezier(.34,1.56,.64,1), background .25s;
  }
  .btn-presente:hover { background:var(--laranja-vivo); transform:translateY(-3px); }
  .assin { margin-top:34px; color:#7C89BC; font-size:.85rem; }
  .assin b { color:#AEB9E2; }
  .credito { margin-top:10px; font-size:.66rem; letter-spacing:.22em; text-transform:uppercase; color:#5A6796; }

  @media (prefers-reduced-motion: reduce) {
    .caixa-wrap, .dica, .revela .catavento { animation:none; }
  }
</style>
</head>

<script>
(function () {
  var reduz = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* bolhas ambiente */
  if (!reduz) {
    for (var i = 0; i < 14; i++) {
      var b = document.createElement("span");
      b.className = "bolha-bg";
      var tam = 8 + Math.random() * 26;
      b.style.width = tam + "px"; b.style.height = tam + "px";
      b.style.left = Math.random() * 100 + "vw";
      b.style.bottom = "-40px";
      b.style.animationDuration = 7 + Math.random() * 9 + "s";
      b.style.animationDelay = -Math.random() * 12 + "s";
      document.body.appendChild(b);
    }
  }

  var presente = document.getElementById("presente");
  var palco = document.getElementById("palco");
  var revela = document.getElementById("revela");
  var aberto = false;

  function confete(cx, cy) {
    var cores = ["#F54F03", "#FF5A12", "#61B1DF", "#BDE0F5", "#FFFFFF", "#0D1D60"];
    for (var i = 0; i < 46; i++) {
      var p = document.createElement("span");
      p.className = "peta";
      var tam = 8 + Math.random() * 16;
      p.style.width = tam + "px"; p.style.height = tam + "px";
      p.style.left = cx + "px"; p.style.top = cy + "px";
      p.style.background = cores[Math.floor(Math.random() * cores.length)];
      var ang = Math.random() * Math.PI * 2;
      var forca = 90 + Math.random() * 300;
      p.style.setProperty("--dx", Math.cos(ang) * forca + "px");
      p.style.setProperty("--dy", (Math.sin(ang) * forca - 160 - Math.random() * 180) + "px");
      p.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
      p.style.setProperty("--dur", (1.4 + Math.random() * 1.4) + "s");
      document.body.appendChild(p);
      p.addEventListener("animationend", function () { this.remove(); });
    }
  }

  function abrir() {
    if (aberto) return;
    aberto = true;
    var r = presente.getBoundingClientRect();
    presente.classList.remove("fechado");
    palco.classList.add("aberto");
    confete(r.left + r.width / 2, r.top + r.height / 2.4);
    setTimeout(function () { confete(r.left + r.width / 2, r.top + r.height / 3); }, 350);
    setTimeout(function () {
      palco.classList.add("aberto-fim");
      revela.setAttribute("aria-hidden", "false");
    }, reduz ? 100 : 500);
  }

  presente.addEventListener("click", abrir);
  presente.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); abrir(); }
  });
})();
</script>

</html>
